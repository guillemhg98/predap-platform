      - Standalone Repositories: platform/standalone-repos.md
      - Private Runtime Setup: platform/private-runtime-setup.md
      - Toy vs Real Integration: platform/toy-vs-real-map.md
      - Submodules: platform/submodules.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - 5-Minute Quickstart: getting-started/quickstart.md
  - User Guide:
      - Data Preprocessing: user-guide/data-preprocessing.md
      - Model Training: user-guide/model-training.md
      - Evaluation & Metrics: user-guide/evaluation.md
      - Configuration Reference: user-guide/configuration.md
  - API Reference:
